name: Build & Release Cosmos IX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # This action installs Android command-line tools and exports sdkmanager on PATH.
      # Keep its package input to one item; multiline values were passed as one invalid package.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36-ext1" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate CI debug keystore if absent
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare named APK artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/CosmosIX-debug.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmosIX-debug-apk
          path: release-artifacts/CosmosIX-debug.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Cosmos IX — Latest Android APK"
          body: |
            ![Cosmos IX Cover](https://raw.githubusercontent.com/${{ github.repository }}/main/app/src/main/res/drawable/img_cosmos_cover.jpg)

            ### Cosmos IX — Native Android 3D Astrophysics Simulator
            Download **`CosmosIX-debug.apk`** below to install directly on your Android device (Android 7.0+ / OpenGL ES 3.0).
          files: release-artifacts/CosmosIX-debug.apk
          make_latest: true
